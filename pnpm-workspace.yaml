packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@eslint/js': ^9.39.5
  '@tailwindcss/postcss': ^4.3.3
  '@types/bun': ^1.3.14
  '@types/node': ^24.13.3
  cspell: ^10.0.1
  eslint: ^9.39.5
  prettier: ^3.9.6
  tailwindcss: ^4.3.3
  # Held at 6.x: typescript-eslint 8.x refuses to load against TS 7
  # ("typescript-eslint does not support TS 7.0"), which fails every lint task.
  typescript: ^6.0.3
  zod: ^4.4.3

catalogs:
  react19:
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    react: ^19.2.8
    react-dom: ^19.2.8

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - bufferutil
  - core-js-pure
  - esbuild
  - lefthook
  - msw
  - prisma
  - sharp
  - utf-8-validate

overrides:
  '@types/minimatch': 5.1.2

publicHoistPattern:
  - '@ianvs/prettier-plugin-sort-imports'
  - prettier-plugin-tailwindcss

minimumReleaseAge: 4320

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lefthook: true
  msw: false
  sharp: true
